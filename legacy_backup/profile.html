<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - MedSmart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/ui-enhancements.css">
</head>

<body>

    <!-- Sidebar injected by layout.js -->

    <div class="main-content">
        <!-- Header injected by layout.js -->

        <section class="view-section active" style="display:block;">
            <div class="view-container" id="profile-content">
                <!-- Content will be dynamically loaded based on user role -->
            </div>
        </section>
    </div>

    <!-- Post-Login Details Modal -->
    <div id="details-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Complete Your Profile</h2>
                <p>Help us serve you better by completing your profile information</p>
            </div>

            <form id="details-form" onsubmit="event.preventDefault(); savePatientDetails();">
                <div class="form-row">
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" id="modal-dob" required>
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <select id="modal-gender" required>
                            <option value="">Select</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Blood Group</label>
                        <select id="modal-bloodGroup">
                            <option value="">Select</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <textarea id="modal-address" rows="3" placeholder="Enter your address"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Emergency Contact Name</label>
                        <input type="text" id="modal-emergencyName" placeholder="Contact person name">
                    </div>
                    <div class="form-group">
                        <label>Emergency Contact Number</label>
                        <input type="tel" id="modal-emergencyPhone" placeholder="Contact number">
                    </div>
                </div>

                <div class="form-group">
                    <label>Known Allergies / Medical Conditions</label>
                    <textarea id="modal-allergies" rows="3"
                        placeholder="List any allergies or medical conditions"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="hideDetailsModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Details</button>
                </div>
            </form>
        </div>
    </div>

    <style>
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 32px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .modal-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
        }

        .form-group textarea {
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-primary,
        .btn-secondary {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 121, 107, 0.3);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-main);
            color: var(--text-main);
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .modal-actions {
                flex-direction: column-reverse;
            }
        }
    </style>

    <script src="js/ui-utilities.js"></script>
    <script src="js/session.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/search.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userData = getUserData();
            const profileContent = document.getElementById('profile-content');

            // Patient Profile View
            profileContent.innerHTML = `
                <div style="background: white; padding: 32px; border-radius: 12px; max-width: 800px; margin: 0 auto; box-shadow: var(--shadow-sm);">
                    <div style="text-align: center; margin-bottom: 32px;">
                        <div style="width: 100px; height: 100px; background: var(--primary-color); color: white; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 2.25rem; font-weight: 700;">${userData.name.split(' ').map(n => n[0]).join('').substring(0, 2)}</div>
                        <h2 style="margin-bottom: 4px;">${userData.name}</h2>
                        <p style="color: var(--text-muted);">Patient ID: #${userData.id}</p>
                        ${!userData.profileComplete ? '<span style="background: #fff3e0; color: #f57c00; padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: 600;">⚠️ Profile Incomplete</span>' : '<span style="background: #e8f5e9; color: #2e7d32; padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: 600;">✓ Profile Complete</span>'}
                    </div>

                    <h3 style="margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;">
                        <span>Personal Information</span>
                        <button onclick="showDetailsModal()" style="background: var(--primary-color); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; font-weight: 600;">
                            <i class="ph ph-pencil-simple"></i> ${userData.profileComplete ? 'Update Details' : 'Complete Profile'}
                        </button>
                    </h3>
                    
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 32px;">
                        <div style="padding: 16px; background: #f8fafc; border-radius: 8px;">
                            <label style="font-size: 0.85rem; color: #64748b; display: block; margin-bottom: 4px;">Email</label>
                            <div style="font-weight: 500;">${userData.email}</div>
                        </div>
                        <div style="padding: 16px; background: #f8fafc; border-radius: 8px;">
                            <label style="font-size: 0.85rem; color: #64748b; display: block; margin-bottom: 4px;">Phone</label>
                            <div style="font-weight: 500;">${userData.phone || 'Not provided'}</div>
                        </div>
                        <div style="padding: 16px; background: #f8fafc; border-radius: 8px;">
                            <label style="font-size: 0.85rem; color: #64748b; display: block; margin-bottom: 4px;">Date of Birth</label>
                            <div style="font-weight: 500;">${userData.dateOfBirth || '<span style="color: #f57c00;">Not provided</span>'}</div>
                        </div>
                        <div style="padding: 16px; background: #f8fafc; border-radius: 8px;">
                            <label style="font-size: 0.85rem; color: #64748b; display: block; margin-bottom: 4px;">Gender</label>
                            <div style="font-weight: 500;">${userData.gender ? userData.gender.charAt(0).toUpperCase() + userData.gender.slice(1) : '<span style="color: #f57c00;">Not provided</span>'}</div>
                        </div>
                        <div style="padding: 16px; background: #f8fafc; border-radius: 8px;">
                            <label style="font-size: 0.85rem; color: #64748b; display: block; margin-bottom: 4px;">Blood Group</label>
                            <div style="font-weight: 500;">${userData.bloodGroup || '<span style="color: #f57c00;">Not provided</span>'}</div>
                        </div>
                        <div style="padding: 16px; background: #f8fafc; border-radius: 8px;">
                            <label style="font-size: 0.85rem; color: #64748b; display: block; margin-bottom: 4px;">Member Since</label>
                            <div style="font-weight: 500;">${new Date(userData.createdAt).toLocaleDateString()}</div>
                        </div>
                    </div>

                    <h3 style="margin-bottom: 16px;">Address & Contact</h3>
                    <div style="display: grid; gap: 16px; margin-bottom: 32px;">
                        <div style="padding: 16px; background: #f8fafc; border-radius: 8px;">
                            <label style="font-size: 0.85rem; color: #64748b; display: block; margin-bottom: 4px;">Address</label>
                            <div style="font-weight: 500;">${userData.address || '<span style="color: #f57c00;">Not provided</span>'}</div>
                        </div>
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;">
                            <div style="padding: 16px; background: #f8fafc; border-radius: 8px;">
                                <label style="font-size: 0.85rem; color: #64748b; display: block; margin-bottom: 4px;">Emergency Contact Name</label>
                                <div style="font-weight: 500;">${userData.emergencyName || '<span style="color: #f57c00;">Not provided</span>'}</div>
                            </div>
                            <div style="padding: 16px; background: #f8fafc; border-radius: 8px;">
                                <label style="font-size: 0.85rem; color: #64748b; display: block; margin-bottom: 4px;">Emergency Contact Number</label>
                                <div style="font-weight: 500;">${userData.emergencyPhone || '<span style="color: #f57c00;">Not provided</span>'}</div>
                            </div>
                        </div>
                    </div>

                    <h3 style="margin-bottom: 16px;">Medical Information</h3>
                    <div style="padding: 16px; background: #fff3e0; border-radius: 8px; border-left: 4px solid #f57c00;">
                        <label style="font-size: 0.85rem; color: #e65100; display: block; margin-bottom: 4px; font-weight: 600;">Known Allergies / Medical Conditions</label>
                        <div style="font-weight: 500; color: #424242;">${userData.allergies || '<span style="color: #f57c00;">No allergies or conditions recorded</span>'}</div>
                    </div>
                </div>
            `;
        });
    </script>
</body>

</html>
