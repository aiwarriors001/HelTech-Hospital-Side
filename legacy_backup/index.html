<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSmart - Hospital Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/ui-enhancements.css">
</head>

<body>

    <!-- Sidebar injected by layout.js -->

    <div class="main-content">
        <!-- Header injected by layout.js -->

        <section class="view-section active" style="display:block;">
            <div class="view-container">
                <!-- Dynamic content loaded based on role -->
                <div id="home-content"></div>
            </div>
        </section>
    </div>



    <script src="js/ui-utilities.js"></script>
    <script src="js/session.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/search.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userData = getUserData();
            const homeContent = document.getElementById('home-content');

            // HOSPITAL HOME PAGE
            homeContent.innerHTML = `
                <div class="hero-banner fade-in" style="position: relative; overflow: hidden;">
                    <h1>Welcome, ${userData.hospitalName || userData.name}!</h1>
                    <p>Manage patient records, view analytics, and streamline hospital operations—all in one place.</p>
                    <a href="patients.html" class="cta-btn ripple-button hover-lift">
                        <i class="ph-bold ph-users"></i> View Patients
                    </a>
                </div>

                <div class="quick-actions stagger-children">
                    <a href="patients.html" class="action-card hover-lift hover-bounce-icon shadow-layered">
                        <div class="action-icon" style="background: linear-gradient(135deg, #e3f2fd, #bbdefb);">
                            <i class="ph-fill ph-users" style="color: #0288d1;"></i>
                        </div>
                        <h3>Patient Management</h3>
                        <p>View and manage patient records</p>
                    </a>

                    <a href="assistant.html" class="action-card hover-lift hover-bounce-icon shadow-layered">
                        <div class="action-icon">
                            <i class="ph-fill ph-chat-circle-dots"></i>
                        </div>
                        <h3>AI Chat</h3>
                        <p>Get instant medical information</p>
                    </a>

                    <a href="dashboard.html" class="action-card hover-lift hover-bounce-icon shadow-layered">
                        <div class="action-icon" style="background: linear-gradient(135deg, #f3e5f5, #e1bee7);">
                            <i class="ph-fill ph-chart-line" style="color: #7b1fa2;"></i>
                        </div>
                        <h3>Analytics</h3>
                        <p>View hospital statistics</p>
                    </a>
                </div>
            `;


        });
    </script>
</body>

</html>
